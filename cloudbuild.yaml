steps:
  # Step 1: Fetch latest AP Poll + game results from CFBD API
  # The updated apPoll.js and liveResults.js will be picked up by the Docker build below
  - name: 'node:20-slim'
    entrypoint: 'bash'
    args:
      - '-c'
      - 'npm ci --omit=dev && CFBD_KEY=$$CFBD_KEY node src/data/scripts/fetch-live-data.mjs'
    secretEnv: ['CFBD_KEY']

  # Step 2: Build the Docker image (data files are now updated in the workspace)
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - build
      - -t
      - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/${_SERVICE}:latest'
      - .

  # Step 3: Push the image to Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - push
      - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/${_SERVICE}:latest'

  # Step 4: Deploy the new image to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - run
      - deploy
      - '${_SERVICE}'
      - '--image=${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/${_SERVICE}:latest'
      - '--region=${_REGION}'
      - '--platform=managed'

substitutions:
  _REGION: us-central1       # change to your Cloud Run region
  _REPO: cfb-games           # change to your Artifact Registry repo name
  _SERVICE: cfb-standings    # change to your Cloud Run service name

availableSecrets:
  secretManager:
    - versionName: 'projects/${PROJECT_ID}/secrets/cfbd-api-key/versions/latest'
      env: 'CFBD_KEY'

images:
  - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/${_SERVICE}:latest'

options:
  logging: CLOUD_LOGGING_ONLY
